name: CI

on:
    pull_request:
        branches: [main, development]

permissions:
    contents: read
    pull-requests: write

jobs:
    checks:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true

        steps:
            - name: 🛒 Checkout code
              uses: actions/checkout@v4

            - name: 🧰 Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🎨 Check Prettier formatting
              run: npx prettier --check "**/*.{js,ts,vue,json,css,md}"

            - name: 🧹 Run ESLint
              run: npm run lint

            - name: 🧪 Run unit tests (if available)
              run: |
                  if npm run | grep -q "test"; then
                    npm run test
                  else
                    echo "No tests configured — skipping."
                  fi

            - name: 🏗️ Build Nuxt app
              run: npm run build
